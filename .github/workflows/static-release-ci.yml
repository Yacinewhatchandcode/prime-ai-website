# PR validation for the release tooling. Read-only token; can never publish
# (the reusable workflow's deploy job is excluded for pull_request events and dry-run mode).
name: static-release CI

on:
  pull_request:
    paths:
      - .github/workflows/static-release.yml
      - .github/workflows/prime-ai-release.yml
      - .github/workflows/static-release-ci.yml
      - scripts/release/**

permissions:
  contents: read
  actions: read

concurrency:
  group: static-release-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tooling-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test scripts/release/static-release.test.mjs
      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color

  prime-dry-run:
    needs: tooling-tests
    uses: ./.github/workflows/static-release.yml
    with:
      site_id: prime-ai
      site_url: https://prime-ai.fr
      cname: prime-ai.fr
      mode: dry-run
      source_sha: ${{ github.event.pull_request.base.sha }}
      approved_ref: ${{ github.event.pull_request.base.ref }}
      tooling_repository: ${{ github.event.pull_request.head.repo.full_name }}
      tooling_sha: ${{ github.event.pull_request.head.sha }}
      test_command: npm run qa:routes && npm run test:data && npm run test:proxy
      build_command: npm run build
      output_dir: dist
      artifact_retention_days: 1
